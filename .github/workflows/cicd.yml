      #     docker build -t backend-test:${{ github.sha }} ./backend

      # - name: Build nginx image (CI test)
      #   run: |
      #     docker build -t nginx-test:${{ github.sha }} ./frontend

      # # =========================
      # #  IMAGE SCAN (TRIVY)
      # # =========================
      # - name: Scan backend image
      #   uses: aquasecurity/trivy-action@0.20.0
      #   with:
      #     image-ref: backend-test:${{ github.sha }}
      #     format: table
      #     exit-code: 1
      #     ignore-unfixed: true
      #     vuln-type: 'os,library'
      #     severity: 'CRITICAL,HIGH'

      # - name: Scan nginx image
      #   uses: aquasecurity/trivy-action@0.20.0
      #   with:
      #     image-ref: nginx-test:${{ github.sha }}
      #     format: table
      #     exit-code: 1
      #     ignore-unfixed: true
      #     vuln-type: 'os,library'
      #     severity: 'CRITICAL,HIGH'

  cd:
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      #  OIDC
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GithubActions
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Test AWS identity
        run: aws sts get-caller-identity

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      #  Build & Push backend
      - name: Build & Push backend
        run: |
          IMAGE=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/awstodo-backend
          docker build -t $IMAGE:${{ github.sha }} ./backend
          docker push $IMAGE:${{ github.sha }}

      #  Build & Push nginx
      - name: Build & Push nginx
        run: |
          IMAGE=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/awstodo-nginx
          docker build -t $IMAGE:${{ github.sha }} ./frontend
          docker push $IMAGE:${{ github.sha }}

      #  Upload docker-compose (version + latest)
      - name: Upload compose to S3 (versioned)
        run: |
          BUCKET=${{ secrets.S3_BUCKET }}

          aws s3 cp docker-compose.yml \
            s3://$BUCKET/deploy/docker-compose-${{ github.sha }}.yml

          aws s3 cp docker-compose.yml \
            s3://$BUCKET/deploy/docker-compose.yml
      - name: Capture current tag for rollback
        id: prev_info
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.WEBSERVER1ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands": ["docker ps --format \"{{.Image}}\" | grep backend | cut -d: -f2 || echo \"latest\""]}' \
            --query "Command.CommandId" --output text)

          sleep 7

          PREV_TAG=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ secrets.WEBSERVER1ID }} \
            --query "StandardOutputContent" --output text | tr -d '\r\n ')
          PREV_TAG=$(echo $PREV_TAG | xargs)
          [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "None" ] && PREV_TAG="latest"

          echo "PREVIOUS_TAG=$PREV_TAG" >> $GITHUB_ENV
          echo "Detected previous tag: $PREV_TAG"

      # ── Ansible setup ──────────────────────────────────────────────────────────
      - name: Install AWS session-manager-plugin
        run: |
          curl -sSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/smp.deb
          sudo dpkg -i /tmp/smp.deb

      - name: Install Ansible and collections
        run: |
          pip install ansible boto3 botocore
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run setup playbook (install Docker — idempotent)
        working-directory: ansible
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          ansible-playbook -i inventories/dev playbooks/site.yml

      # ── DB Init (idempotent — safe on every run) ───────────────────────────────
      - name: Init database schema via Ansible
        working-directory: ansible
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          DB_SECRET_NAME: ${{ secrets.DB_SECRET_NAME }}
        run: |
          ansible-playbook -i inventories/dev playbooks/db.yml --tags init

      # ── Deploy via Ansible ──────────────────────────────────────────────────────
      - name: Deploy webapp via Ansible
        working-directory: ansible
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          ansible-playbook -i inventories/dev playbooks/web.yml

      # ── Health check + rollback ─────────────────────────────────────────────────
      - name: Health check and rollback
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          READINESS_URL="http://${{ secrets.LB_DNS }}/health/db"
          LIVENESS_URL="http://${{ secrets.LB_DNS }}/health"

          sleep 20

          check_health() {
            local label=$1
            echo "Checking $label..."
            for i in $(seq 1 8); do
              STATUS_READY=$(curl -s -o /dev/null -w "%{http_code}" "$READINESS_URL")
              BODY_READY=$(curl -s --max-time 5 "$READINESS_URL")
              STATUS_LIVE=$(curl -s -o /dev/null -w "%{http_code}" "$LIVENESS_URL")
              BODY_LIVE=$(curl -s --max-time 5 "$LIVENESS_URL")

              echo "Attempt $i: READY=$STATUS_READY, LIVE=$STATUS_LIVE"

              if [ "$STATUS_READY" = "200" ] && echo "$BODY_READY" | grep -q '"status":"OK"' \
                && [ "$STATUS_LIVE" = "200" ] && echo "$BODY_LIVE" | grep -q "OK"; then
                echo "$label is healthy!"
                return 0
              fi
              sleep 10
            done
            return 1
          }

          if check_health "NEW VERSION"; then
            echo "Deployment successful!"
            exit 0
          fi

          echo "New version unhealthy — rolling back to ${{ env.PREVIOUS_TAG }} via Ansible..."
          cd ansible
          IMAGE_TAG=${{ env.PREVIOUS_TAG }} \
            ansible-playbook -i inventories/dev playbooks/web.yml

          sleep 15

          if check_health "PREVIOUS VERSION"; then
            echo "Rollback succeeded"
            exit 1
          else
            echo "CRITICAL: rollback also failed"
            exit 1
          fi