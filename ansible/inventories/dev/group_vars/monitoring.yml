# SSM Session Manager connection — same as webservers, no SSH needed
ansible_connection: community.aws.aws_ssm
ansible_aws_ssm_region: "ap-southeast-2"
ansible_aws_ssm_bucket_name: "{{ lookup('env', 'S3_BUCKET') }}"
ansible_aws_ssm_bucket_key_prefix: "ansible-tmp"
ansible_aws_ssm_s3_addressing_style: virtual
ansible_remote_tmp: /tmp/.ansible/tmp
ansible_user: ec2-user

# Monitoring config
app_dir: /home/ec2-user/monitoring
aws_region: "ap-southeast-2"
deploy_env: "dev"
app_environment: "dev"
ssm_params_path: "/todoapp/dev/"
db_credentials_secret_name: "awstodo/dev/db/credentials"
grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"
