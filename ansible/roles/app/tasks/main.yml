---
- name: Create app directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0750"
  become: true

- name: Copy docker-compose.yml from workspace
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker-compose.yml"
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: ec2-user
    group: ec2-user
    mode: "0640"

- name: Fetch SSM app parameters
  ansible.builtin.set_fact:
    ssm_app_params: >-
      {{ lookup('amazon.aws.aws_ssm', ssm_params_path,
                region=aws_region,
                bypath=True,
                shortnames=True,
                decrypt=True) }}

- name: Write .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: ec2-user
    group: ec2-user
    mode: "0600"

- name: ECR login
  ansible.builtin.shell:
    cmd: >
      aws ecr get-login-password --region {{ aws_region }} |
      docker login --username AWS --password-stdin
      {{ aws_account_id }}.dkr.ecr.{{ aws_region }}.amazonaws.com
  become: true
  no_log: true
  changed_when: true

- name: Pull Docker images
  ansible.builtin.shell:
    cmd: docker compose pull
    chdir: "{{ app_dir }}"
  environment:
    TAG: "{{ image_tag }}"
  become: true

- name: Deploy with docker compose
  ansible.builtin.shell:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ app_dir }}"
  environment:
    TAG: "{{ image_tag }}"
  become: true

- name: Prune unused images
  ansible.builtin.shell:
    cmd: docker image prune -f
  become: true
  changed_when: false

- name: Remove .env file
  ansible.builtin.file:
    path: "{{ app_dir }}/.env"
    state: absent
