---
- name: Create monitoring directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0750"
  become: true

- name: Create Grafana provisioning directory
  ansible.builtin.file:
    path: "{{ app_dir }}/grafana/provisioning/datasources"
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"
  become: true

- name: Copy docker-compose.monitoring.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker-compose.monitoring.yml"
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: ec2-user
    group: ec2-user
    mode: "0640"
  become: true

- name: Create Grafana dashboards provisioning directory
  ansible.builtin.file:
    path: "{{ app_dir }}/grafana/provisioning/dashboards"
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"
  become: true

- name: Create Grafana alerting provisioning directory
  ansible.builtin.file:
    path: "{{ app_dir }}/grafana/provisioning/alerting"
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"
  become: true

- name: Copy Grafana datasource provisioning
  ansible.builtin.copy:
    src: grafana-datasource.yml
    dest: "{{ app_dir }}/grafana/provisioning/datasources/prometheus.yml"
    owner: ec2-user
    group: ec2-user
    mode: "0644"
  become: true

- name: Copy Grafana dashboard provider config
  ansible.builtin.copy:
    src: grafana-dashboard-provider.yml
    dest: "{{ app_dir }}/grafana/provisioning/dashboards/provider.yml"
    owner: ec2-user
    group: ec2-user
    mode: "0644"
  become: true

- name: Copy dashboard JSON files
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ app_dir }}/grafana/provisioning/dashboards/"
    owner: ec2-user
    group: ec2-user
    mode: "0644"
  become: true

- name: Copy Grafana alert rules
  ansible.builtin.copy:
    src: grafana-alerting.yml
    dest: "{{ app_dir }}/grafana/provisioning/alerting/alerts.yml"
    owner: ec2-user
    group: ec2-user
    mode: "0644"
  become: true

- name: Fetch SSM parameters
  ansible.builtin.set_fact:
    ssm_app_params: >-
      {{ lookup('amazon.aws.aws_ssm', ssm_params_path,
                region=aws_region,
                bypath=True,
                shortnames=True,
                decrypt=True) }}

- name: Get EC2 instance ID (IMDSv2)
  ansible.builtin.shell: |
    TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
      -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
    curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
      "http://169.254.169.254/latest/meta-data/instance-id"
  register: instance_id_result
  changed_when: false

- name: Set instance_id fact
  ansible.builtin.set_fact:
    instance_id: "{{ instance_id_result.stdout }}"

- name: Write .env file
  ansible.builtin.template:
    src: monitoring.env.j2
    dest: "{{ app_dir }}/.env"
    owner: ec2-user
    group: ec2-user
    mode: "0600"
  become: true

- name: Render prometheus.yml
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ app_dir }}/prometheus.yml"
    owner: ec2-user
    group: ec2-user
    mode: "0644"
  become: true

- name: Ensure monitoring log group exists
  amazon.aws.cloudwatch_log_group:
    log_group_name: "/todoapp/{{ app_environment }}/monitoring"
    state: present
    retention: 14
    region: "{{ aws_region }}"

- name: Pull monitoring images
  ansible.builtin.shell:
    cmd: docker compose pull
    chdir: "{{ app_dir }}"
  become: true
  changed_when: false
  register: pull_result
  retries: 3
  delay: 30
  until: pull_result.rc == 0

- name: Deploy monitoring stack
  ansible.builtin.shell:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ app_dir }}"
  become: true
  changed_when: true

- name: Restart Grafana to reload provisioning
  ansible.builtin.shell:
    cmd: docker compose restart grafana
    chdir: "{{ app_dir }}"
  become: true
  changed_when: true
